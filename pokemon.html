<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pokémon de Kanto</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px;
    }

    img {
      width: 40px;
      height: 40px;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <h1>Los 151 Pokémon de Kanto</h1>
  <ol id="lista-pokemon"></ol>

  <script>
    const nombres = [
      "Bulbasaur", "Ivysaur", "Venusaur", "Charmander", "Charmeleon",
      "Charizard", "Squirtle", "Wartortle", "Blastoise", "Caterpie",
      "Metapod", "Butterfree", "Weedle", "Kakuna", "Beedrill",
      "Pidgey", "Pidgeotto", "Pidgeot", "Rattata", "Raticate",
      "Spearow", "Fearow", "Ekans", "Arbok", "Pikachu",
      "Raichu", "Sandshrew", "Sandslash", "Nidoran♀", "Nidorina",
      "Nidoqueen", "Nidoran♂", "Nidorino", "Nidoking", "Clefairy",
      "Clefable", "Vulpix", "Ninetales", "Jigglypuff", "Wigglytuff",
      "Zubat", "Golbat", "Oddish", "Gloom", "Vileplume",
      "Paras", "Parasect", "Venonat", "Venomoth", "Diglett",
      "Dugtrio", "Meowth", "Persian", "Psyduck", "Golduck",
      "Mankey", "Primeape", "Growlithe", "Arcanine", "Poliwag",
      "Poliwhirl", "Poliwrath", "Abra", "Kadabra", "Alakazam",
      "Machop", "Machoke", "Machamp", "Bellsprout", "Weepinbell",
      "Victreebel", "Tentacool", "Tentacruel", "Geodude", "Graveler",
      "Golem", "Ponyta", "Rapidash", "Slowpoke", "Slowbro",
      "Magnemite", "Magneton", "Farfetch'd", "Doduo", "Dodrio",
      "Seel", "Dewgong", "Grimer", "Muk", "Shellder",
      "Cloyster", "Gastly", "Haunter", "Gengar", "Onix",
      "Drowzee", "Hypno", "Krabby", "Kingler", "Voltorb",
      "Electrode", "Exeggcute", "Exeggutor", "Cubone", "Marowak",
      "Hitmonlee", "Hitmonchan", "Lickitung", "Koffing", "Weezing",
      "Rhyhorn", "Rhydon", "Chansey", "Tangela", "Kangaskhan",
      "Horsea", "Seadra", "Goldeen", "Seaking", "Staryu",
      "Starmie", "Mr. Mime", "Scyther", "Jynx", "Electabuzz",
      "Magmar", "Pinsir", "Tauros", "Magikarp", "Gyarados",
      "Lapras", "Ditto", "Eevee", "Vaporeon", "Jolteon",
      "Flareon", "Porygon", "Omanyte", "Omastar", "Kabuto",
      "Kabutops", "Aerodactyl", "Snorlax", "Articuno", "Zapdos",
      "Moltres", "Dratini", "Dragonair", "Dragonite", "Mewtwo",
      "Mew"
    ];

    const lista = document.getElementById("lista-pokemon");

    nombres.forEach((nombre, indice) => {
      const numero = indice + 1;
      const elemento = document.createElement("li");
      const imagen = document.createElement("img");

      imagen.src =
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/"
        + numero + ".png";
      imagen.alt = nombre;

      elemento.appendChild(imagen);
      elemento.appendChild(document.createTextNode(nombre));
      lista.appendChild(elemento);
    });
  </script>
</body>
</html>
